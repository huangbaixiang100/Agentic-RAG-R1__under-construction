project:
  name: "xiaobeir1"
  description: "under-construction"

experiment:
  name: "qwen_rolloutreward_medqa"  # 实验名称，对应 experiments/ 下的目录
  random_seed: 42

# SwanLab配置
swanlab: true

model:
  name: "/home/xiaobei/Agentic-RAG-R1__under-construction/sftmodel/qwen3_1.7b_medqa_sft_merged"
  torch_dtype: "bfloat16"
  device_map: null

dataset:
  name: "medqa"
  num_eval: 100
 # train_file: "/home/xiaobei/Agentic-RAG-R1__under-construction/src/data/medqa_train_atomic_data.jsonl"

training:
  continue_training: false
  current_step: 0

  use_lora: true
  use_quant: false  # 全参数微调时建议关闭量化以获得更好效果
  batch_size: 1
  learning_rate: 0.000005  # 全参数微调使用更低的学习率
  num_iterations: 10 # epoch
  steps_per_iteration: 5 # in one epoch
  save_interval: 10 # steps

  generation:
    num_generations: 4
    max_new_tokens: 256  # 减少生成长度，避免失控
    max_length_for_gather: 8192  # 减少最大长度
    max_generate_iterations: 10   # 减少轮数
    temperature: 0.7
    do_sample: True
  
  optimizer:
    beta: 0.04
  #beta: 0
    mu: 1
    epsilon: 0.1

lora:
  r: 8
  lora_alpha: 32
  target_modules:
    - "q_proj"    # qwen
    - "v_proj"    # qwen
  lora_dropout: 0.1
  bias: "none"
  task_type: "CAUSAL_LM"

qlora:
  load_in_4bit: True           # zero 2 可以为True
  bnb_4bit_quant_type: "nf4"
  bnb_4bit_compute_dtype: "bfloat16"
  bnb_4bit_use_double_quant: True   # zero 2 可以为True
  load_in_8bit: False    # enable 8bit quantization
  llm_int8_threshold: 6.0   # if load_in_8bit is True
